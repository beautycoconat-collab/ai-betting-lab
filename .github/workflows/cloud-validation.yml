name: Phase 0.1 isolated validation
on:
  workflow_dispatch:
    inputs:
      hosted:
        description: Also run on a NEW empty Supabase TEST project
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ai-lab-cloud-validation
  cancel-in-progress: false
jobs:
  native:
    if: vars.FREE_BUDGET_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ai_betting_lab_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_betting_lab_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-cloud.txt
      - run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests_phase2 -v
          python -m unittest discover -s tests_foundation -v
          python -m unittest discover -s tests_cloud -v
      - name: Native sessions, security, budget trigger; no pilot
        env:
          LAB_TEST_DSN: host=127.0.0.1 dbname=ai_betting_lab_test_ci user=postgres
          LAB_EXPECTED_DB_HOST: 127.0.0.1
          LAB_DISPOSABLE_TEST_PROJECT: '1'
        run: python -m cloudcheck.runner --mode native --out reports/phase01/native.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci --prefix supabase/tests --ignore-scripts --no-audit --no-fund
          node supabase/tests/validate-foundation.mjs
          node supabase/tests/validate-cloud.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sanitized-report
          path: reports/phase01/native.json
          retention-days: 3
  hosted:
    needs: native
    if: inputs.hosted && vars.FREE_BUDGET_CONFIRMED == 'true'
    environment: supabase-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-cloud.txt
      - name: Validate isolated hosted project
        env:
          LAB_TEST_DSN: ${{ secrets.LAB_TEST_DSN }}
          LAB_EXPECTED_DB_HOST: ${{ secrets.LAB_EXPECTED_DB_HOST }}
          LAB_TEST_PROJECT_REF: ${{ secrets.LAB_TEST_PROJECT_REF }}
          LAB_SUPABASE_ANON_KEY: ${{ secrets.LAB_SUPABASE_ANON_KEY }}
          LAB_AUTH_JWT: ${{ secrets.LAB_AUTH_JWT }}
          LAB_CA_PEM: ${{ secrets.LAB_CA_PEM }}
          LAB_DISPOSABLE_TEST_PROJECT: '1'
        run: |
          python -m cloudcheck.ci_hosted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-sanitized-report
          path: reports/phase01/hosted.json
          retention-days: 3
# Manual only. No pull_request_target, deployments, service-role key or pilot.
