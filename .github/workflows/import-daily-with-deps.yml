name: Import daily patch with dependencies
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/expert-engines
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project requirements
        run: pip install -r requirements-cloud.txt -r requirements-phase2.txt
      - name: Extract and test overlay
        run: |
          unzip -q AI-Betting-Lab-MASTER.zip -d /tmp/lab-patch
          cp -R /tmp/lab-patch/abl_daily_patch/. .
          python -c "from scripts.apply_daily_health_patch import apply;print(apply(patch_root='/tmp/lab-patch/abl_daily_patch'))"
          python -m unittest discover -s tests_dashboard -v
      - name: Commit tested overlay
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add dashboard docs scripts tests_dashboard .github/workflows
          git add README_TR.md PACKAGE_MANIFEST.json
          git commit -m "Integrate tested daily automation overlay"
          git push origin HEAD:feature/expert-engines
