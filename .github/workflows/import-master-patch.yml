name: Import uploaded daily patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/expert-engines
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safely import overlay
        shell: bash
        run: |
          python - -&lt;&lt;'PY'
          import json, zipfile, pathlib
          z=zipfile.ZipFile('AI-Betting-Lab-MASTER.zip')
          manifest=json.loads(z.read('abl_daily_patch/PACKAGE_MANIFEST.json'))
          assert manifest['base_branch']=='feature/expert-engines'
          paths=manifest['contents']
          assert len(paths)==len(set(paths))
          for p in paths:
              rel=pathlib.PurePosixPath(p)
              assert not rel.is_absolute() and '..' not in rel.parts
              assert p not in ('README_TR.md','PACKAGE_MANIFEST.json') or True
              source='abl_daily_patch/'+p
              assert source in z.namelist(), source
              target=pathlib.Path(p)
              assert not target.exists(), 'Existing file: '+p
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(z.read(source))
          PY
          python scripts/apply_daily_health_patch.py
          python -m unittest discover -s tests_dashboard -v
      - name: Commit only verified overlay
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
 git add .github/workflows/daily-research-preview.yml .github/workflows/daily-research-scheduled.yml PACKAGE_MANIFEST.json README_TR.md dashboard/automation_cli.py dashboard/daily_health.py dashboard/daily_orchestrator.py dashboard/daily_performance.py dashboard/daily_quality.py dashboard/hosted_readiness.py dashboard/scheduled_gate.py dashboard/security_acceptance.py dashboard/supabase_security_audit.py dashboard/daily.py docs/DAILY_AUTOMATION_ACCEPTANCE_TR.md docs/LIVE_DEPLOYMENT_STATUS_20261019_TR.md scripts/apply_daily_health_patch.py tests_dashboard/
 git commit -m 'Integrate verified daily automation patch' 
          git push origin HEAD:feature/expert-engines
