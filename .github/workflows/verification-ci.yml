name: Complete offline and native verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ai_betting_lab_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_betting_lab_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-cloud.txt
      - name: Python regressions
        run: python -m scripts.ci_python
      - name: Native PostgreSQL independent connections
        env:
          LAB_TEST_DSN: host=127.0.0.1 dbname=ai_betting_lab_test_ci user=postgres
          LAB_EXPECTED_DB_HOST: 127.0.0.1
          LAB_DISPOSABLE_TEST_PROJECT: '1'
        run: python -m cloudcheck.runner --mode native --out reports/ci/native.json
      - name: Sanitized native report
        if: always()
        run: |
          if [ -f reports/ci/native.json ]; then cat reports/ci/native.json; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dashboard publication and JavaScript checks
        run: |
          node --check public/app.js
          node scripts/check_dashboard.mjs
          node scripts/test_dashboard_ui.mjs
      - name: PGlite migration and security checks
        run: |
          npm ci --prefix supabase/tests --ignore-scripts --no-audit --no-fund
          node supabase/tests/validate.mjs
          node supabase/tests/validate-phase2.mjs
          node supabase/tests/validate-foundation.mjs
          node supabase/tests/validate-cloud.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitized-native-verification
          path: reports/ci/native.json
          retention-days: 3
# No external DB credentials, data collection, paid runner or virtual pilot.
