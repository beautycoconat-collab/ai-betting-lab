name: Import daily Python patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/expert-engines
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-cloud.txt -r requirements-phase2.txt
      - name: Apply and test Python files
        run: |
          unzip -q AI-Betting-Lab-MASTER.zip -d /tmp/lab-patch
          cp -R /tmp/lab-patch/abl_daily_patch/dashboard/. dashboard/
          cp -R /tmp/lab-patch/abl_daily_patch/tests_dashboard/. tests_dashboard/
          cp -R /tmp/lab-patch/abl_daily_patch/docs/. docs/
          cp -R /tmp/lab-patch/abl_daily_patch/scripts/. scripts/
          python -c "from scripts.apply_daily_health_patch import apply;print(apply(patch_root='/tmp/lab-patch/abl_daily_patch'))"
          python -m unittest discover -s tests_dashboard -v
      - name: Push Python files only
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add dashboard docs scripts tests_dashboard
          git commit -m "Integrate tested daily automation Python modules"
          git push origin HEAD:feature/expert-engines
