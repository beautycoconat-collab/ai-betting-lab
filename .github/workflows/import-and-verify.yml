name: Restore full project and verify
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-and-verify.yml'
      - 'source-package.json'
      - 'project-source.zip.part-*'
      - 'restore_project.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-lab-complete-verification
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ai_betting_lab_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_betting_lab_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify hashes and restore full original project
        run: python restore_project.py
      - run: python -m pip install -r requirements-cloud.txt
      - name: All Python regression tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests_phase2 -v
          python -m unittest discover -s tests_foundation -v
          python -m unittest discover -s tests_cloud -v
      - name: Native PostgreSQL security and independent concurrent sessions
        env:
          LAB_TEST_DSN: host=127.0.0.1 dbname=ai_betting_lab_test_ci user=postgres
          LAB_EXPECTED_DB_HOST: 127.0.0.1
          LAB_DISPOSABLE_TEST_PROJECT: '1'
        run: python -m cloudcheck.runner --mode native --out reports/ci/native.json
      - name: Sanitized native result
        if: always()
        run: |
          if [ -f reports/ci/native.json ]; then cat reports/ci/native.json; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All PGlite migration checks
        run: |
          npm ci --prefix supabase/tests --ignore-scripts --no-audit --no-fund
          node supabase/tests/validate.mjs
          node supabase/tests/validate-phase2.mjs
          node supabase/tests/validate-foundation.mjs
          node supabase/tests/validate-cloud.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitized-postgres-verification
          path: reports/ci/native.json
          retention-days: 3
# Read-only GitHub token. No Supabase credentials or automated deployment.
