name: Apply daily ZIP overlay
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/expert-engines
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract and test
        run: |
          unzip -q AI-Betting-Lab-MASTER.zip -d /tmp/lab-patch
          cp -R /tmp/lab-patch/abl_daily_patch/. .
          python scripts/apply_daily_health_patch.py
          python -m unittest discover -s tests_dashboard -v
      - name: Commit verified changes
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add dashboard docs scripts tests_dashboard .github/workflows
          git add README_TR.md PACKAGE_MANIFEST.json
          git commit -m "Import tested daily automation modules"
          git push origin HEAD:feature/expert-engines
